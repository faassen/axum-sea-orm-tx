[package]
name = "axum-sea-orm-tx"
version = "0.1.0"
edition = "2024"
description = "Request-scoped SeaORM transactions for axum."
license = "MIT OR Apache-2.0"
repository = "https://github.com/faassen/axum-sea-orm-tx"

[dependencies]
axum = "0.8.9"
sea-orm = { version = "2.0.4", default-features = false }
thiserror = "2.0.21"
tracing = "0.1.44"

[dev-dependencies]
sea-orm = { version = "2.0.4", default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }

[lints.rust]
missing_docs = "warn"
